# Docker override for the `maedeup` worktree (branch: feature/code-review-improvements).
#
# The sibling worktree at ../maedeup-ai runs the same docker-compose.yml on
# default ports. This override file re-maps ports and renames containers so
# both worktrees can run their own Docker stack side-by-side.
#
# Usage: from this directory, run
#   docker compose -p maedeup-cr up -d
#
# Ports (host side):
#   fastapi-app   : 8001  (was 8000)
#   frontend      : 3001  (was 3000)
#   postgres-db   : 5433  (was 5432)
#   redis-broker  : 6380  (was 6379)
#
# `!override` replaces the base array instead of merging (default compose
# behaviour is additive merge, which would leave both host ports bound).

services:
  fastapi-app:
    container_name: maedeup-cr-api
    ports: !override
      - "8001:8000"
    # Override CORS origin so the cr-stack frontend (port 3001) is trusted.
    environment:
      FRONTEND_URL: "http://localhost:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]

  frontend:
    container_name: maedeup-cr-frontend
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8001"
        NEXT_PUBLIC_WS_URL: "ws://localhost:8001"
    ports: !override
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8001"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8001"

  postgres-db:
    container_name: maedeup-cr-postgres
    ports: !override
      - "5433:5432"

  redis-broker:
    container_name: maedeup-cr-redis
    ports: !override
      - "6380:6379"
